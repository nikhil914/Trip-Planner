name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Release build
        run: ./gradlew :app:assembleRelease

      - name: APK size
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          bytes=$(stat -c %s "$apk")
          echo "APK: $apk"
          echo "Size: $bytes bytes"
          echo "### Release APK: $(awk "BEGIN { printf \"%.2f\", $bytes / 1048576 }") MB" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: field-guide-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: field-guide-release-apk
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls dist/*.apk | head -n 1)
          mv "$apk" "dist/field-guide-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "dist/field-guide-$GITHUB_REF_NAME.apk" \
            --repo "$GITHUB_REPOSITORY" --title "Field Guide $GITHUB_REF_NAME" --generate-notes
