name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=release key" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            echo "::error::A release needs the RELEASE_KEYSTORE_BASE64 secret."
            exit 1
          else
            echo "signed=debug key" >> "$GITHUB_OUTPUT"
          fi

      - name: Release build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: APK size
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          bytes=$(stat -c %s "$apk")
          echo "APK: $apk"
          echo "Size: $bytes bytes"
          echo "### Release APK: $(awk "BEGIN { printf \"%.2f\", $bytes / 1048576 }") MB" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed with the ${{ steps.signing.outputs.signed }}." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: field-guide-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: field-guide-release-apk
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+(\.[0-9]+){1,2}$'; then
            echo "::error::Version must look like v0.1.0."
            exit 1
          fi
          apk=$(ls dist/*.apk | head -n 1)
          mv "$apk" "dist/field-guide-$VERSION.apk"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$VERSION" "dist/field-guide-$VERSION.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" "dist/field-guide-$VERSION.apk" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Field Guide $VERSION" --generate-notes
          fi
